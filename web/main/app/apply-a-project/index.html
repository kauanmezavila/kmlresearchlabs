<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ed" />

    <title>Thank You — NextLab</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --paper: #f5f3ed;
        --ink: #24241f;
        --muted: #85847b;
        --line: #e5e2d9;
        --accent: #ff4500;

        --serif: "Playfair Display", Georgia, serif;
        --sans: "DM Sans", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }

      .main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
      }

      .thank-you {
        width: 100%;
        max-width: 720px;
        text-align: center;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        margin-bottom: 22px;
      }

      h1 {
        font-family: var(--serif);
        font-size: clamp(42px, 7vw, 76px);
        font-weight: 500;
        line-height: 1.08;
        letter-spacing: -2px;
        margin-bottom: 25px;
      }

      h1 em {
        color: var(--accent);
        font-weight: 500;
      }

      .description {
        max-width: 500px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.9;
      }

      .home-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 38px;
        padding: 10px 20px;
        background: var(--ink);
        color: white;
        border: 1px solid var(--ink);
        border-radius: 8px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 700;
      }

      .home-button:hover {
        background: var(--accent);
        border-color: var(--accent);
      }

      @media (max-width: 600px) {
        .main {
          padding: 50px 22px;
        }

        h1 {
          letter-spacing: -1.5px;
        }

        .description {
          font-size: 13px;
        }
      }
    </style>
  </head>

  <body>
    <main class="main">
      <section class="thank-you">
        <h1>
          Your project<br />
          has been <em>applied</em>.
        </h1>

        <p class="description">
          Thank you for your interest to submit your project into KML Research
          Labs.<br />
          We may return you soon.
        </p>

        <a href="/" class="home-button">
          Back to homepage
          <span>></span>
        </a>
      </section>
    </main>
  </body>
</html>
